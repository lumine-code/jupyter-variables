name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Lint, formatting, and packing don't need the native `zeromq` binding
      # (rebuilt for Electron inside the editor), so skip install scripts for a
      # fast, reliable job.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check package contents
        run: npm pack --dry-run

  python-session:
    name: Python 3.15.1 namespace session on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LUMINE_TEST_JUPYTER_REPL: ${{ github.workspace }}/jupyter-repl
    steps:
      - uses: actions/checkout@v7
        with:
          path: jupyter-variables
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/jupyter-repl
          path: jupyter-repl
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            jupyter-variables/package-lock.json
            jupyter-repl/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.1"
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install package dependencies
        working-directory: jupyter-variables
        run: npm ci --ignore-scripts
      - name: Install the kernel provider
        working-directory: jupyter-repl
        run: npm ci --ignore-scripts
      - name: Install the full Python notebook stack from wheels
        run: |
          python -m pip install --only-binary=:all: "ipykernel==7.4.0" "numpy==2.5.4" "pandas==3.1.0" "pyarrow>=26,<27"
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Exercise namespace reads, edits, idle refresh and restart with a real kernel
        working-directory: jupyter-variables
        timeout-minutes: 3
        run: npm run test:python-session

  integration:
    # Run the Jasmine spec suite inside a real Lumine build. The specs use the
    # editor runtime (lumine config/notifications, the watchFile path-watcher), so
    # this is the single place they run in CI.
    name: Lumine integration specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_TEST_LIVE_PYTHON: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          path: jupyter-variables
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15.1"
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install Linux build and headless-display dependencies
        run: |
          # A third-party repository on the runner image answering 403 must not
          # fail the job: the lists this actually needs still fetched, and the
          # install below stays strict, so a missing package still stops us.
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      # The specs only touch pure library modules and the editor runtime, so the
      # native `zeromq` binding is never loaded; skip install scripts.
      - name: Install package dependencies
        working-directory: jupyter-variables
        run: npm ci --ignore-scripts
      # Mirrors the editor's own CI: install without scripts (patch-package and
      # some native install scripts misbehave; native modules are rebuilt for
      # Electron below), then reproduce the pieces that matter. npm records the
      # @lumine-code git forks with ssh URLs, but the runner has no ssh key, so
      # rewrite them to anonymous HTTPS (the forks are public). Serialized
      # retries absorb flaky git-hosted fork downloads.
      - name: Use HTTPS for GitHub git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Apply patches
        working-directory: lumine
        run: npx patch-package
      - name: Download the Electron binary
        working-directory: lumine
        run: node ./node_modules/electron/install.js
      - name: Rebuild native modules for Electron
        working-directory: lumine
        run: npm run build
      - name: Run the Jasmine spec suite
        working-directory: lumine
        timeout-minutes: 20
        run: xvfb-run --auto-servernum npm start -- --test ../jupyter-variables/spec
